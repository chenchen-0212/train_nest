# pnpm 工作区配置
#
# allowBuilds：显式声明「哪些依赖允许/禁止执行安装期构建脚本」
#
# 为什么 pnpm 10+ 要加这道闸门：
#   依赖的 postinstall 脚本可以执行任意代码（下载二进制、写文件、发网络请求）。
#   供应链攻击的常见手法就是往某个包的 postinstall 里塞恶意代码。
#   所以 pnpm 默认不再自动执行，要求你逐个明确表态。
#
# 【逐条判断，不要一批放行】
#   判断依据：这个包在安装期【必须】做什么？不做会怎样？
#     → 需要编译原生模块 / 下载平台专用二进制 → 必须放行，否则包不可用
#     → 只是统计安装量、发遥测               → 拒绝
#     → 不确定                               → 先查包源码或官方说明，再决定
allowBuilds:
  # 遥测包：用于统计安装量，安装期会往外发请求。
  # 不做任何功能性构建 → 拒绝。（企业内网 / 供应链合规场景下这类遥测应当关掉）
  '@scarf/scarf': false

  # 原生模块：bcrypt 的哈希核心是 C++ 实现，安装期需要
  #   node-gyp 编译 或 下载平台预编译二进制。
  # 不放行 → 装出来的包没有可用实现，运行到 require 时才报错。
  # → 必须放行。（这也正是它比纯 JS 实现快十倍以上的原因）
  bcrypt: true
