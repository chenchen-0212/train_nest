# pnpm 工作区配置
#
# allowBuilds：显式声明「哪些依赖允许/禁止执行安装期构建脚本」
#
# 为什么 pnpm 10+ 要加这道闸门：
#   依赖的 postinstall 脚本可以执行任意代码（下载二进制、写文件、发网络请求）。
#   供应链攻击的常见手法就是往某个包的 postinstall 里塞恶意代码。
#   所以 pnpm 默认不再自动执行，要求你逐个明确表态。
#
# 这里把 @scarf/scarf 设为 false：
#   它是用于统计安装量的遥测包，不做任何功能性构建，安装期会往外发请求。
#   在企业内网 / 供应链合规场景下，这类遥测应当关掉。
allowBuilds:
  '@scarf/scarf': false
